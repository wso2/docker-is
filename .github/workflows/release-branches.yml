# Tags and releases every <major>.<minor>.x branch (7.3.x, 7.2.x, ..., 5.7.x) when a PR is merged into it.
#
# This file only needs to exist on the default branch (master):
#  - pull_request_target always runs the default branch's workflow, whatever the PR's base branch is.
#  - schedule and workflow_dispatch also run from the default branch; schedule is a fallback that
#    picks up anything a PR-triggered run missed (e.g. a direct push or a blocked/failed run).
# Each run releases every branch whose head is ahead of its latest v<major>.<minor>.0.<N> tag,
# so runs are idempotent. PR code is never checked out or executed.
name: Release branches

on:
  pull_request_target:
    types: [closed]
    branches:
      - '[0-9]+.[0-9]+.x'
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:
    inputs:
      branches:
        description: 'Space-separated release branches, e.g. "7.2.x 7.3.x". Leave empty for all.'
        required: false
        default: ''
      dry_run:
        description: 'Only print the tags and releases that would be created'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-branches
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Tag and release branches
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCHES: ${{ inputs.branches }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: bash .github/scripts/release-branches.sh

  # Optionally opens a PR in another repository that records this repository's release versions in a
  # JSON file, raising each one to the latest tag here. Its location is held only in secrets and every
  # part of it is masked in this public repository's logs. Skipped until these secrets are set:
  #   SYNC_FILE_URL  https://github.com/<owner>/<repo>/blob/<branch>/<path>
  #   SYNC_TOKEN     token with contents + pull-requests write on that repository,
  #                  or SYNC_APP_ID + SYNC_APP_PRIVATE_KEY for a GitHub App installed on it
  sync-release-versions:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_APP: ${{ secrets.SYNC_APP_ID != '' && secrets.SYNC_APP_PRIVATE_KEY != '' }}
      HAS_TOKEN: ${{ secrets.SYNC_TOKEN != '' }}
    steps:
      - name: Check configuration
        id: config
        env:
          SYNC_FILE_URL: ${{ secrets.SYNC_FILE_URL }}
        run: |
          url_regex='^https://github\.com/([^/]+)/([^/]+)/blob/([^#?]+/[^#?]+)$'
          if [[ "$SYNC_FILE_URL" =~ $url_regex ]] && [[ "$HAS_APP" == "true" || "$HAS_TOKEN" == "true" ]]; then
            owner="${BASH_REMATCH[1]}" repo="${BASH_REMATCH[2]}" ref_path="${BASH_REMATCH[3]}"
            # Mask each part on its own so none of them can appear in the log, even separately.
            for value in "$owner" "$repo" "$owner/$repo" "$ref_path"; do echo "::add-mask::${value}"; done
            {
              echo "enabled=true"
              echo "owner=${owner}"
              echo "repo=${repo}"
              echo "ref_path=${ref_path}"
            } >> "$GITHUB_OUTPUT"
          else
            if [[ -n "$SYNC_FILE_URL" ]]; then
              echo "::warning::SYNC_FILE_URL is not a https://github.com/<owner>/<repo>/blob/<branch>/<path> URL, or no token is set."
            fi
            echo "::notice::Release version sync is not configured; skipping."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout default branch
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Create GitHub App token
        id: app-token
        if: steps.config.outputs.enabled == 'true' && env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ steps.config.outputs.owner }}
          repositories: ${{ steps.config.outputs.repo }}

      - name: Open or update pull request
        if: steps.config.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TOKEN: ${{ steps.app-token.outputs.token || secrets.SYNC_TOKEN }}
          TARGET_REPO: ${{ steps.config.outputs.owner }}/${{ steps.config.outputs.repo }}
          TARGET_REF_PATH: ${{ steps.config.outputs.ref_path }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: bash .github/scripts/sync-release-versions.sh
